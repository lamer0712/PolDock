plugins {
    id 'com.android.application'
}

def configuredGithubRepository = providers.gradleProperty('poldock.githubRepository')
        .orElse(providers.environmentVariable('POLDOCK_GITHUB_REPOSITORY'))
        .getOrElse('')
def configuredVersionCode = providers.gradleProperty('poldock.versionCode').getOrElse('1')
def configuredVersionName = providers.gradleProperty('poldock.versionName').getOrElse('1.0')

def githubRepository = configuredGithubRepository
if (!githubRepository) {
    def remote = providers.exec {
        commandLine 'git', 'config', '--get', 'remote.origin.url'
        ignoreExitValue = true
    }.standardOutput.asText.get().trim()
    def match = remote =~ /github\.com[\/:]([^\/]+\/[^\/]+?)(?:\.git)?$/
    if (match.find()) githubRepository = match.group(1)
}

android {
    namespace 'com.oemtools.poldock'
    compileSdk 36

    defaultConfig {
        applicationId 'com.oemtools.poldock'
        // targetSdk 22 이하 → 설치 시 SYSTEM_ALERT_WINDOW 자동 부여 (Android 12 동작).
        // 폴스타4엔 오버레이 허용 설정 화면이 없어 이 방식으로 권한을 받는다.
        minSdk 22
        targetSdk 22
        versionCode configuredVersionCode.toInteger()
        versionName configuredVersionName
        buildConfigField 'String', 'GITHUB_REPOSITORY',
                '"' + githubRepository.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // 사이드로드 전용 앱 → Play 스토어의 targetSdk 하한 경고는 무시
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
