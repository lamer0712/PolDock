plugins {
    id 'com.android.application'
}

android {
    namespace 'com.oemtools.poldock'
    compileSdk 36

    defaultConfig {
        applicationId 'com.oemtools.poldock'
        // targetSdk 22 이하 → 설치 시 SYSTEM_ALERT_WINDOW 자동 부여 (Android 12 동작).
        // 폴스타4엔 오버레이 허용 설정 화면이 없어 이 방식으로 권한을 받는다.
        minSdk 22
        targetSdk 22
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // 사이드로드 전용 앱 → Play 스토어의 targetSdk 하한 경고는 무시
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
}
